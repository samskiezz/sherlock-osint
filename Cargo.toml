[workspace]
members = ["erps-core", "erps-store", "erps-api", "erps-eval"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "=0.4.39", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tantivy = "0.22"
datafusion = { version = "43", default-features = false }
rayon = "1"
strsim = "0.11"
unicode-normalization = "0.1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
